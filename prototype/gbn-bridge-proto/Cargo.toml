[package]
name = "gbn-bridge-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[workspace]
resolver = "2"
members = [
    "crates/gbn-bridge-protocol",
    "crates/gbn-bridge-creator",
    "crates/gbn-bridge-runtime",
    "crates/gbn-bridge-publisher",
    "crates/gbn-bridge-cli",
    "crates/gbn-bridge-mobile-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fahdabidi/Veritas"

[workspace.dependencies]
aes-gcm = "0.10"
aws-config = "1"
aws-sdk-cloudwatch = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
hkdf = "0.12"
opentelemetry = { version = "0.21", features = ["trace"] }
opentelemetry-otlp = { version = "0.14", features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.21", features = ["trace", "rt-tokio"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
prometheus = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-opentelemetry = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tungstenite = "0.24"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
ed25519-dalek.workspace = true
gbn-bridge-protocol = { path = "crates/gbn-bridge-protocol" }
gbn-bridge-creator = { path = "crates/gbn-bridge-creator" }
gbn-bridge-publisher = { path = "crates/gbn-bridge-publisher" }
gbn-bridge-runtime = { path = "crates/gbn-bridge-runtime" }
postgres.workspace = true
