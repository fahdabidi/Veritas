apiVersion: apps/v1
kind: Deployment
metadata:
  name: exit-bridge
  labels:
    app.kubernetes.io/name: exit-bridge
    app.kubernetes.io/part-of: veritas-conduit
    veritas-role: bridge
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: exit-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exit-bridge
        app.kubernetes.io/part-of: veritas-conduit
        veritas-role: bridge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: exit-bridge
          image: veritas/exit-bridge:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: udp-punch
              containerPort: 4443
              protocol: UDP
            - name: admin
              containerPort: 9090
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: conduit-config
            - secretRef:
                name: conduit-signing
          env:
            - name: GBN_BRIDGE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GBN_BRIDGE_INGRESS_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - curl -fsS http://127.0.0.1:9090/v1/admin/metrics >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 18
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - curl -fsS http://127.0.0.1:9090/v1/admin/metrics >/dev/null
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
