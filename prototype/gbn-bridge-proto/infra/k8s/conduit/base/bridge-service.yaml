apiVersion: v1
kind: Service
metadata:
  name: exit-bridge
  labels:
    app.kubernetes.io/name: exit-bridge
    app.kubernetes.io/part-of: veritas-conduit
    veritas-role: bridge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: exit-bridge
  ports:
    - name: udp-punch
      port: 4443
      targetPort: udp-punch
      protocol: UDP
    - name: admin
      port: 9090
      targetPort: admin
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
