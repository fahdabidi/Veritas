apiVersion: v1
kind: ConfigMap
metadata:
  name: conduit-config
data:
  GBN_BRIDGE_AUTHORITY_URL: "http://publisher-authority:8080"
  GBN_BRIDGE_RECEIVER_URL: "http://publisher-receiver:8081"
  GBN_BRIDGE_CONTROL_URL: "ws://publisher-authority:8080/v1/bridge/control"
  GBN_BRIDGE_PUBLISHER_BIND_ADDR: "0.0.0.0:8080"
  GBN_BRIDGE_RECEIVER_BIND_ADDR: "0.0.0.0:8081"
  GBN_BRIDGE_ADMIN_BIND_ADDR: "0.0.0.0:9090"
  GBN_BRIDGE_ADMIN_BOOTSTRAP_TIMEOUT_SECS: "90"
  GBN_BRIDGE_CREATOR_UPLOAD_RESPONSE_TIMEOUT_MS: "90000"
  GBN_BRIDGE_CREATOR_UPLOAD_CLOSE_TIMEOUT_MS: "2000"
  GBN_BRIDGE_HTTP_CONNECT_TIMEOUT_MS: "60000"
  GBN_BRIDGE_HTTP_READ_TIMEOUT_MS: "60000"
  GBN_BRIDGE_HTTP_WRITE_TIMEOUT_MS: "60000"
  GBN_BRIDGE_POSTGRES_HOST: "postgres"
  GBN_BRIDGE_POSTGRES_PORT: "5432"
  GBN_BRIDGE_POSTGRES_SCHEMA: "conduit_publisher"
  GBN_BRIDGE_POSTGRES_SSLMODE: "disable"
  GBN_BRIDGE_PUBLISHER_SIGNING_MODE: "hex"
  GBN_BRIDGE_REACHABILITY_CLASS: "direct"
  GBN_BRIDGE_PUNCH_PORT: "4443"
  GBN_BRIDGE_UPLOAD_FRAGMENT_BYTES: "16000"
  GBN_BRIDGE_CONTROL_KEEPALIVE_INTERVAL_MS: "5000"
  GBN_BRIDGE_CONTROL_MAX_SKEW_MS: "120000"
  GBN_BRIDGE_AUTH_MAX_SKEW_MS: "120000"
  GBN_BRIDGE_POLL_INTERVAL_MS: "50"
  GBN_BRIDGE_AUTHORITY_LEASE_TTL_MS: "3600000"
  GBN_BRIDGE_AUTHORITY_CATALOG_TTL_MS: "3600000"
  GBN_BRIDGE_AUTHORITY_BOOTSTRAP_ENTRY_TTL_MS: "3600000"
  GBN_BRIDGE_AUTHORITY_BOOTSTRAP_RESPONSE_TTL_MS: "3600000"
  GBN_BRIDGE_AUTHORITY_PUNCH_INSTRUCTION_TTL_MS: "3600000"
  GBN_BRIDGE_UPLOAD_PERSISTENCE_MODE: "complete_only"
  GBN_BRIDGE_HEARTBEAT_PERSISTENCE_MODE: "deferred"
  GBN_BRIDGE_STACK_ENV: "dev-local"
  GBN_BRIDGE_CLOUDWATCH_ENABLED: "false"
  GBN_BRIDGE_METRICS_BIND_ADDR: "0.0.0.0:9100"
  GBN_BRIDGE_OTLP_ENDPOINT: "http://tempo.observability.svc.cluster.local:4317"
  OTEL_BSP_MAX_QUEUE_SIZE: "256"
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "64"
  OTEL_BSP_SCHEDULE_DELAY_MILLIS: "500"
  OTEL_BSP_EXPORT_TIMEOUT_MILLIS: "5000"
  OTEL_BSP_MAX_CONCURRENT_EXPORTS: "1"
  RUST_LOG: "warn,gbn_bridge_cli=info,gbn_bridge_creator=info,gbn_bridge_publisher=info,gbn_bridge_runtime=info,creator_runner=info,exit_bridge=info,publisher_authority=info,publisher_receiver=info"
