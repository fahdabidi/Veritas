apiVersion: apps/v1
kind: Deployment
metadata:
  name: creator-host
  labels:
    app.kubernetes.io/name: creator-host
    app.kubernetes.io/part-of: veritas-conduit
    veritas-role: creator
    conduit-actor: host-creator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: creator-host
  template:
    metadata:
      labels:
        app.kubernetes.io/name: creator-host
        app.kubernetes.io/part-of: veritas-conduit
        veritas-role: creator
        conduit-actor: host-creator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9100"
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: creator-runner
          image: veritas/creator-runner:dev
          imagePullPolicy: Never
          ports:
            - name: admin
              containerPort: 9090
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: conduit-config
            - secretRef:
                name: conduit-signing
          env:
            - name: GBN_BRIDGE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GBN_CONDUIT_ACTOR
              value: host-creator
            - name: GBN_BRIDGE_INGRESS_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GBN_BRIDGE_STATE_DIR
              value: /var/lib/gbn-conduit
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - curl -fsS http://127.0.0.1:9090/v1/admin/node-metadata >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - curl -fsS http://127.0.0.1:9090/v1/admin/node-metadata >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/gbn-conduit
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: creator-host-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: creator-host-state
  labels:
    app.kubernetes.io/name: creator-host
    app.kubernetes.io/part-of: veritas-conduit
    veritas-role: creator
    conduit-actor: host-creator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: creator-host
  labels:
    app.kubernetes.io/name: creator-host
    app.kubernetes.io/part-of: veritas-conduit
    veritas-role: creator
    conduit-actor: host-creator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: creator-host
  ports:
    - name: admin
      port: 9090
      targetPort: admin
