apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher-receiver
  labels:
    app.kubernetes.io/name: publisher-receiver
    app.kubernetes.io/part-of: veritas-conduit
    veritas-role: receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: publisher-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: publisher-receiver
        app.kubernetes.io/part-of: veritas-conduit
        veritas-role: receiver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: publisher-receiver
          image: veritas/publisher-receiver:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
            - name: admin
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: conduit-config
            - secretRef:
                name: conduit-signing
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
